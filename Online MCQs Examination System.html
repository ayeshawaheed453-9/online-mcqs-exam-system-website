<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online MCQs Examination System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2340;--mute:#667091;--line:#e2e6f2;--pri:#4f46e5;--pri2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--soft:#eef0ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#181c36;--ink:#eceefb;--mute:#9aa3c7;--line:#2a3058;--soft:#222850;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1226;--card:#181c36;--ink:#eceefb;--mute:#9aa3c7;--line:#2a3058;--soft:#222850;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.brand i{font-style:normal;background:rgba(255,255,255,.2);border-radius:10px;padding:4px 8px}
nav button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 14px;margin-left:6px;cursor:pointer;font-weight:600}
nav button.on{background:#fff;color:var(--pri)}
main{max-width:980px;margin:22px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 24px rgba(40,50,120,.07);margin-bottom:16px}
h1,h2,h3{margin:0 0 10px}
h1{font-size:1.7rem}
p.mute,.mute{color:var(--mute)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.92rem}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
.btn{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:700;cursor:pointer;font-size:1rem}
.btn.ghost{background:var(--soft);color:var(--pri)}
.btn.red{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--soft);border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--pri)}
ul.rules{padding-left:20px;color:var(--mute)}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.3rem;background:var(--soft);padding:6px 14px;border-radius:10px}
.timer.low{background:var(--bad);color:#fff}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}
.bar div{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .3s}
.layout{display:grid;grid-template-columns:1fr 250px;gap:16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin:9px 0;cursor:pointer;font:inherit}
.opt:hover{border-color:var(--pri)}
.opt.sel{border-color:var(--pri);background:var(--soft)}
.opt.right{border-color:var(--ok);background:rgba(22,163,74,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(220,38,38,.12)}
.opt span.k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700}
.opt.sel span.k{background:var(--pri);color:#fff}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pal button{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer}
.pal button.ans{background:var(--ok);color:#fff;border-color:var(--ok)}
.pal button.flag{background:var(--warn);color:#fff;border-color:var(--warn)}
.pal button.cur{outline:3px solid var(--pri)}
.legend{font-size:.8rem;color:var(--mute);margin-top:12px;line-height:1.9}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:middle}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:8px auto;font-size:2rem;font-weight:800}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.rev{border-left:4px solid var(--line);padding:4px 0 4px 14px;margin:16px 0}
.rev.ok{border-color:var(--ok)}.rev.no{border-color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(10,12,30,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:420px;margin:0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:60;font-weight:600}
body{background:radial-gradient(1000px 420px at 8% -10%,rgba(124,58,237,.16),transparent),radial-gradient(800px 380px at 100% 0,rgba(79,70,229,.16),transparent),var(--bg);background-attachment:fixed}
header{position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(79,70,229,.25)}
.card{animation:rise .35s ease both;transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 12px 34px rgba(40,50,120,.13)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn{transition:transform .15s,box-shadow .15s}.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px rgba(79,70,229,.35)}
.opt{transition:transform .12s,border-color .15s,background .15s}.opt:hover{transform:translateX(4px)}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:center;background:linear-gradient(125deg,var(--pri),var(--pri2));color:#fff;border-radius:22px;padding:34px;margin-bottom:16px;box-shadow:0 16px 44px rgba(79,70,229,.32);animation:rise .4s ease both}
.hero h1{font-size:2.1rem;line-height:1.2;margin:12px 0}.hero h1 em{font-style:normal;color:#ffe08a}
.hero p{margin:0;opacity:.92}
.pill{display:inline-block;background:rgba(255,255,255,.2);padding:5px 14px;border-radius:99px;font-size:.82rem;font-weight:700;letter-spacing:.04em}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feat div{background:rgba(255,255,255,.16);border-radius:14px;padding:16px 8px;text-align:center;font-size:1.6rem}
.feat b{display:block;font-size:.85rem;margin-top:4px}
.exp{background:var(--soft);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:.9rem;color:var(--ink)}
body{font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(120deg,#4338ca,#7c3aed,#db2777);background-size:200% 200%;animation:flow 12s ease infinite}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
nav button{transition:background .2s,transform .15s}nav button:hover{transform:translateY(-2px)}
.hero{background:linear-gradient(125deg,#4338ca,#7c3aed 55%,#db2777);position:relative;overflow:hidden;padding:42px 36px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:280px;height:280px;right:-70px;top:-100px}.hero::after{width:170px;height:170px;left:42%;bottom:-90px}
.hero>*{position:relative;z-index:1}.hero h1{font-size:2.4rem;font-weight:800}
.feat div{backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);transition:transform .2s}.feat div:hover{transform:translateY(-6px) scale(1.05)}
.card{border-radius:20px}.card:hover{border-color:var(--pri)}
.btn{background:linear-gradient(120deg,var(--pri),var(--pri2),#db2777);background-size:180% 100%;border-radius:12px}
.btn:hover:not(:disabled){background-position:100% 0}
.btn.ghost{background:var(--soft);color:var(--pri)}.btn.red{background:linear-gradient(120deg,#dc2626,#e11d48);color:#fff}
.bar{height:10px}.bar div{box-shadow:0 0 12px rgba(124,58,237,.6)}
.opt{border-radius:14px;padding:15px 16px;font-size:1.02rem}.opt.sel{box-shadow:0 6px 18px rgba(79,70,229,.22)}
.opt span.k{background:var(--soft);color:var(--pri)}.opt.sel span.k{background:var(--pri);color:#fff}
.pal button{border-radius:12px;transition:transform .12s}.pal button:hover{transform:scale(1.1)}
.timer{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.timer.low{background:var(--bad);animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.07)}}
.stat{border:1px solid var(--line);transition:transform .2s}.stat:hover{transform:translateY(-3px)}
.ring{box-shadow:0 10px 30px rgba(79,70,229,.25)}
.cf{position:fixed;top:-30px;font-size:1.5rem;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:760px){.layout{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.hero{grid-template-columns:1fr;padding:26px}.hero h1{font-size:1.7rem}}
</style>
</head>
<body>
<header>
  <div class="brand"><i>✓</i> Online MCQs Examination System</div>
  <nav><button id="nH" class="on">Exam</button><button id="nA">Admin</button></nav>
</header>
<main id="app"></main>
<div id="modal" class="modal hidden"></div>

<script>
var KQ="mcq_bank",KS="mcq_settings",KR="mcq_results",KP="mcq_pin";
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var DEFAULT_Q=[
{q:"What is the derivative of sin(x)?",o:["cos(x)","−cos(x)","sin(x)","−sin(x)"],a:0},
{q:"Evaluate the integral of 2x dx.",o:["x + C","x² + C","2x² + C","2 + C"],a:1},
{q:"What is the determinant of the matrix [[1, 2], [3, 4]]?",o:["−2","2","10","−10"],a:0},
{q:"What is the sum of the interior angles of a triangle?",o:["90°","180°","270°","360°"],a:1},
{q:"What is the binary number 1011 in decimal?",o:["9","10","11","13"],a:2},
{q:"What does HTML stand for?",o:["HyperText Markup Language","High Text Machine Language","HyperTool Multi Language","Home Text Markup Language"],a:0},
{q:"What is the time complexity of binary search on a sorted array of n items?",o:["O(n)","O(log n)","O(n log n)","O(1)"],a:1},
{q:"Which of these numbers is NOT prime?",o:["2","3","9","11"],a:2},
{q:"What is the limit of sin(x)/x as x approaches 0?",o:["0","∞","1","Undefined"],a:2},
{q:"Which data structure follows the LIFO principle?",o:["Queue","Stack","Array","Graph"],a:1}];
var EXPL=["The derivative of sin(x) is cos(x).","By the power rule, the integral of xⁿ is xⁿ⁺¹/(n+1), so 2x integrates to x² + C.","For [[a, b], [c, d]] the determinant is ad − bc = 1×4 − 2×3 = −2.","In Euclidean geometry the three angles of any triangle add up to 180°.","1011 in binary = 8 + 0 + 2 + 1 = 11.","HTML is HyperText Markup Language, the standard language for structuring web pages.","Binary search halves the search range at every step, so it takes O(log n) time.","9 = 3 × 3, so it has a divisor other than 1 and itself. 2, 3 and 11 are prime.","This is a standard limit: for small x, sin(x) is approximately x, so the ratio tends to 1.","In a stack the last item pushed is the first one popped (Last In, First Out)."];
DEFAULT_Q.forEach(function(q,i){q.e=EXPL[i]});
function expl(q){if(q.e)return q.e;var d=DEFAULT_Q.filter(function(x){return x.q===q.q})[0];return d?d.e:""}
var bank=load(KQ,null)||DEFAULT_Q.slice();
var cfg=load(KS,{minutes:10,pass:50,shuffle:true});
var results=load(KR,[]);
var ex=null,timer=null,tab="exam",adminOK=false;
var app=document.getElementById("app");

function setTab(t){tab=t;document.getElementById("nH").className=t==="exam"?"on":"";document.getElementById("nA").className=t==="admin"?"on":"";
  if(t==="exam"){ex&&!ex.done?renderExam():renderHome()}else renderAdmin()}
document.getElementById("nH").onclick=function(){setTab("exam")};
document.getElementById("nA").onclick=function(){setTab("admin")};

function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2400)}
function ask(msg,yes,label){var m=document.getElementById("modal");m.classList.remove("hidden");
  m.innerHTML='<div class="card"><h3>Please confirm</h3><p>'+msg+'</p><div class="row"><button class="btn" id="mY">'+(label||"Yes, continue")+'</button><button class="btn ghost" id="mN">Cancel</button></div></div>';
  document.getElementById("mY").onclick=function(){m.classList.add("hidden");yes()};
  document.getElementById("mN").onclick=function(){m.classList.add("hidden")}}

/* ---------- HOME ---------- */
function renderHome(){
  app.innerHTML='<section class="hero"><div><span class="pill">ONLINE EXAMINATION PORTAL</span><h1>Test your knowledge. <em>Get instant results.</em></h1><p>A secure, timed multiple-choice exam with live progress tracking, automatic marking and a complete answer review.</p></div><div class="feat"><div>⏱<b>Timed</b></div><div>🛡<b>Secure</b></div><div>⚡<b>Instant</b></div></div></section><div class="card"><h2>Candidate details</h2><p class="mute">Enter your details to begin the test.</p>'+
  '<div class="stats"><div class="stat"><b>'+bank.length+'</b>Questions</div><div class="stat"><b>'+cfg.minutes+' min</b>Time limit</div><div class="stat"><b>'+cfg.pass+'%</b>Pass mark</div></div>'+
  '<div class="grid2"><div><label for="nm">Full name</label><input id="nm" placeholder="e.g. Ayesha Waheed" maxlength="60"></div><div><label for="rl">Roll number</label><input id="rl" placeholder="e.g. 2024-MATH-01" maxlength="30"></div></div>'+
  '<h3 style="margin-top:20px">Instructions</h3><ul class="rules"><li>Each question has one correct answer. There is no negative marking.</li><li>You can move between questions and mark any for review.</li><li>Switching tabs or windows is recorded. After 3 warnings the exam is submitted automatically.</li><li>The test submits automatically when the timer reaches zero.</li></ul>'+
  '<button class="btn" id="go">Start exam</button></div>';
  document.getElementById("go").onclick=function(){
    var n=document.getElementById("nm").value.trim(),r=document.getElementById("rl").value.trim();
    if(!n||!r){toast("Please enter your name and roll number");return}
    if(!bank.length){toast("No questions available. Ask the admin to add some.");return}
    startExam(n,r)}}

function startExam(n,r){
  var idx=bank.map(function(_,i){return i});
  if(cfg.shuffle)for(var i=idx.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=idx[i];idx[i]=idx[j];idx[j]=t}
  ex={name:n,roll:r,order:idx,ans:idx.map(function(){return -1}),flag:idx.map(function(){return false}),i:0,left:cfg.minutes*60,warns:0,done:false,start:Date.now()};
  clearInterval(timer);timer=setInterval(tick,1000);renderExam()}

function tick(){if(!ex||ex.done)return;ex.left--;var t=document.getElementById("tm");
  if(t){t.textContent=fmt(ex.left);t.className="timer"+(ex.left<=60?" low":"")}
  if(ex.left<=0){toast("Time is up. Submitting…");submit()}}
function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return(m<10?"0":"")+m+":"+(x<10?"0":"")+x}

/* ---------- EXAM ---------- */
function renderExam(){
  var q=bank[ex.order[ex.i]],n=ex.order.length,L="ABCD",answered=ex.ans.filter(function(a){return a>=0}).length;
  var opts=q.o.map(function(t,k){return'<button class="opt'+(ex.ans[ex.i]===k?" sel":"")+'" data-k="'+k+'"><span class="k">'+L[k]+'</span><span>'+esc(t)+'</span></button>'}).join("");
  var pal=ex.order.map(function(_,i){var c=(ex.flag[i]?"flag":ex.ans[i]>=0?"ans":"")+(i===ex.i?" cur":"");return'<button class="'+c+'" data-i="'+i+'">'+(i+1)+'</button>'}).join("");
  app.innerHTML='<div class="layout"><div class="card"><div class="top"><div><b>'+esc(ex.name)+'</b> <span class="mute">· '+esc(ex.roll)+'</span></div><div class="timer'+(ex.left<=60?" low":"")+'" id="tm">'+fmt(ex.left)+'</div></div>'+
  '<div class="bar"><div style="width:'+(answered/n*100)+'%"></div></div><p class="mute" style="margin:0">Question '+(ex.i+1)+' of '+n+' · '+answered+' answered</p>'+
  '<h2 style="margin-top:14px">'+esc(q.q)+'</h2>'+opts+
  '<div class="row" style="margin-top:16px"><button class="btn ghost" id="pv"'+(ex.i===0?" disabled":"")+'>← Previous</button><button class="btn ghost" id="fl">'+(ex.flag[ex.i]?"Unmark review":"Mark for review")+'</button><button class="btn ghost" id="cl">Clear</button>'+
  (ex.i<n-1?'<button class="btn" id="nx" style="margin-left:auto">Next →</button>':'<button class="btn" id="sb" style="margin-left:auto">Submit exam</button>')+'</div></div>'+
  '<div class="card"><h3>Question palette</h3><div class="pal">'+pal+'</div><div class="legend"><span class="dot" style="background:var(--ok)"></span>Answered<br><span class="dot" style="background:var(--warn)"></span>Marked for review<br><span class="dot" style="background:var(--line)"></span>Not answered<br>Warnings: <b>'+ex.warns+'/3</b></div><button class="btn red" id="sb2" style="width:100%;margin-top:14px">Submit exam</button></div></div>';
  app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){ex.ans[ex.i]=+b.dataset.k;renderExam()}});
  app.querySelectorAll(".pal button").forEach(function(b){b.onclick=function(){ex.i=+b.dataset.i;renderExam()}});
  var $=function(id){return document.getElementById(id)};
  $("pv").onclick=function(){ex.i--;renderExam()};
  if($("nx"))$("nx").onclick=function(){ex.i++;renderExam()};
  $("fl").onclick=function(){ex.flag[ex.i]=!ex.flag[ex.i];renderExam()};
  $("cl").onclick=function(){ex.ans[ex.i]=-1;renderExam()};
  var conf=function(){var un=ex.ans.filter(function(a){return a<0}).length;ask(un?"You have <b>"+un+"</b> unanswered question(s). Submit anyway?":"Submit your exam now? This cannot be undone.",submit,"Submit")};
  if($("sb"))$("sb").onclick=conf;$("sb2").onclick=conf}

/* anti-cheat: tab switch warnings, no copy / context menu during exam */
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&ex&&!ex.done&&tab==="exam"){ex.warns++;
    if(ex.warns>=3){toast("3 warnings reached. Submitting.");submit()}else{toast("Warning "+ex.warns+"/3: do not leave the exam tab")}}});
["contextmenu","copy","cut","paste"].forEach(function(e){document.addEventListener(e,function(ev){if(ex&&!ex.done&&tab==="exam")ev.preventDefault()})});
window.addEventListener("beforeunload",function(e){if(ex&&!ex.done){e.preventDefault();e.returnValue=""}});

/* ---------- RESULT ---------- */
function submit(){
  if(!ex||ex.done)return;ex.done=true;clearInterval(timer);
  var score=0;ex.order.forEach(function(bi,i){if(ex.ans[i]===bank[bi].a)score++});
  var n=ex.order.length,pct=Math.round(score/n*100);
  ex.score=score;ex.pct=pct;ex.pass=pct>=cfg.pass;ex.used=Math.min(cfg.minutes*60,Math.round((Date.now()-ex.start)/1000));
  results.push({name:ex.name,roll:ex.roll,score:score,total:n,pct:pct,pass:ex.pass,date:new Date().toLocaleString()});save(KR,results);
  tab="exam";setTab("exam");renderResult()}

function renderResult(){
  var L="ABCD",n=ex.order.length,wrong=0,skip=0;
  ex.order.forEach(function(bi,i){if(ex.ans[i]<0)skip++;else if(ex.ans[i]!==bank[bi].a)wrong++});
  var col=ex.pass?"var(--ok)":"var(--bad)";
  var rev=ex.order.map(function(bi,i){var q=bank[bi],ok=ex.ans[i]===q.a;
    return'<div class="rev '+(ok?"ok":"no")+'"><b>Q'+(i+1)+'. '+esc(q.q)+'</b>'+q.o.map(function(t,k){
      var c=k===q.a?"right":(k===ex.ans[i]?"wrong":"");return'<div class="opt '+c+'" style="cursor:default;padding:8px 12px;margin:6px 0"><span class="k">'+L[k]+'</span><span>'+esc(t)+(k===q.a?" ✓":"")+(k===ex.ans[i]&&!ok?" (your answer)":"")+'</span></div>'}).join("")+(ex.ans[i]<0?'<div class="mute">Not answered</div>':"")+(expl(q)?'<div class="exp">💡 '+esc(expl(q))+'</div>':"")+'</div>'}).join("");
  app.innerHTML='<div class="card" style="text-align:center"><h1>Exam result</h1><p class="mute">'+esc(ex.name)+' · '+esc(ex.roll)+'</p>'+
  '<div class="ring" style="background:conic-gradient('+col+' '+ex.pct+'%,var(--line) 0)"><div>'+ex.pct+'%</div></div>'+
  '<span class="badge" style="background:'+col+'">'+(ex.pass?"PASSED":"FAILED")+'</span>'+
  '<div class="stats"><div class="stat"><b>'+ex.score+'/'+n+'</b>Score</div><div class="stat"><b style="color:var(--ok)">'+ex.score+'</b>Correct</div><div class="stat"><b style="color:var(--bad)">'+wrong+'</b>Wrong</div><div class="stat"><b>'+skip+'</b>Skipped</div><div class="stat"><b>'+fmt(ex.used)+'</b>Time used</div></div>'+
  '<div class="row" style="justify-content:center"><button class="btn" id="again">Take another exam</button><button class="btn ghost" onclick="window.print()">Print result</button></div></div>'+
  '<div class="card"><h2>Answer review</h2>'+rev+'</div>';
  document.getElementById("again").onclick=function(){ex=null;renderHome()};if(ex.pass)confetti()}
function confetti(){var e=["🎉","✨","🎊","⭐","💜"];for(var i=0;i<28;i++){var s=document.createElement("span");s.className="cf";s.textContent=e[i%5];s.style.left=Math.random()*100+"vw";s.style.animationDuration=(2+Math.random()*2.5)+"s";s.style.animationDelay=(Math.random()*.8)+"s";document.body.appendChild(s);setTimeout(s.remove.bind(s),5500)}}

/* ---------- ADMIN ---------- */
function renderAdmin(){
  var pin=load(KP,"1234");
  if(!adminOK){
    app.innerHTML='<div class="card" style="max-width:420px;margin:30px auto"><h2>Admin login</h2><p class="mute">Enter the admin PIN (default: 1234).</p><input id="pn" type="password" placeholder="PIN"><br><br><button class="btn" id="lg">Login</button></div>';
    document.getElementById("lg").onclick=function(){if(document.getElementById("pn").value===pin){adminOK=true;renderAdmin()}else toast("Incorrect PIN")};return}
  var rows=bank.map(function(q,i){return'<tr><td>'+(i+1)+'</td><td>'+esc(q.q)+'</td><td>'+"ABCD"[q.a]+'</td><td><button class="btn ghost" data-d="'+i+'">Delete</button></td></tr>'}).join("");
  var rr=results.slice().reverse().map(function(r){return'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.roll)+'</td><td>'+r.score+'/'+r.total+'</td><td>'+r.pct+'%</td><td style="color:'+(r.pass?"var(--ok)":"var(--bad)")+'">'+(r.pass?"Pass":"Fail")+'</td><td>'+esc(r.date)+'</td></tr>'}).join("");
  app.innerHTML='<div class="card"><h2>Exam settings</h2><div class="grid2"><div><label for="cm">Time limit (minutes)</label><input id="cm" type="number" min="1" max="300" value="'+cfg.minutes+'"></div><div><label for="cp">Pass mark (%)</label><input id="cp" type="number" min="1" max="100" value="'+cfg.pass+'"></div></div>'+
  '<label><input type="checkbox" id="cs" style="width:auto" '+(cfg.shuffle?"checked":"")+'> Shuffle question order</label><br><div class="row"><button class="btn" id="ss">Save settings</button><button class="btn ghost" id="lo">Logout</button></div></div>'+
  '<div class="card"><h2>Add a question</h2><label for="qt">Question</label><textarea id="qt" rows="2"></textarea><div class="grid2"><div><label for="o0">Option A</label><input id="o0"></div><div><label for="o1">Option B</label><input id="o1"></div><div><label for="o2">Option C</label><input id="o2"></div><div><label for="o3">Option D</label><input id="o3"></div></div>'+
  '<label for="ca">Correct answer</label><select id="ca"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><br><button class="btn" id="aq">Add question</button></div>'+
  '<div class="card"><div class="top"><h2>Question bank ('+bank.length+')</h2><button class="btn ghost" id="rs">Restore sample questions</button></div><div class="scroll"><table class="tbl"><tr><th>#</th><th>Question</th><th>Ans</th><th></th></tr>'+rows+'</table></div></div>'+
  '<div class="card"><div class="top"><h2>Student results ('+results.length+')</h2><button class="btn ghost" id="cr">Clear results</button></div><div class="scroll"><table class="tbl"><tr><th>Name</th><th>Roll</th><th>Score</th><th>%</th><th>Status</th><th>Date</th></tr>'+(rr||'<tr><td colspan="6" class="mute">No attempts yet.</td></tr>')+'</table></div></div>';
  var $=function(id){return document.getElementById(id)};
  $("lo").onclick=function(){adminOK=false;renderAdmin()};
  $("ss").onclick=function(){var m=parseInt($("cm").value,10),p=parseInt($("cp").value,10);
    if(!(m>=1&&m<=300&&p>=1&&p<=100)){toast("Enter valid values");return}
    cfg={minutes:m,pass:p,shuffle:$("cs").checked};save(KS,cfg);toast("Settings saved")};
  $("aq").onclick=function(){var t=$("qt").value.trim(),o=[0,1,2,3].map(function(i){return $("o"+i).value.trim()});
    if(!t||o.some(function(x){return!x})){toast("Fill the question and all four options");return}
    bank.push({q:t,o:o,a:+$("ca").value});save(KQ,bank);toast("Question added");renderAdmin()};
  app.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){ask("Delete this question?",function(){bank.splice(+b.dataset.d,1);save(KQ,bank);renderAdmin()},"Delete")}});
  $("rs").onclick=function(){ask("Replace the bank with the 10 sample questions?",function(){bank=DEFAULT_Q.slice();save(KQ,bank);renderAdmin()},"Restore")};
  $("cr").onclick=function(){ask("Clear all stored results?",function(){results=[];save(KR,results);renderAdmin()},"Clear")}}

renderHome();
</script>
</body>
</html>
